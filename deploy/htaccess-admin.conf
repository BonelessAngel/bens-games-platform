# Sicherheits-Kopfzeilen für die Zentrale (admin.bens-games.de und Test-Zentrale): strenger, nie einbettbar, nicht indexieren.
# Wird beim Deploy als markierter Block an die .htaccess im Hauptordner angehängt (scripts/merge-htaccess.mjs);
# der Verzeichnisschutz aus dem KAS bleibt unverändert.
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "no-referrer"
  Header always set X-Frame-Options "DENY"
  Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>
