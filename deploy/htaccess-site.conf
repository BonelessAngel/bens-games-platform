# Sicherheits-Kopfzeilen und eigene Fehlerseite für die Webseite (bens-games.de und Testseite).
# Wird beim Deploy als markierter Block an die .htaccess im Hauptordner angehängt (scripts/merge-htaccess.mjs);
# alles andere in der Datei (z. B. der Verzeichnisschutz aus dem KAS) bleibt unverändert.
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
</IfModule>
ErrorDocument 404 /404.html
