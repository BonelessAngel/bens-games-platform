<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impressum – Bens Games</title>
  <meta name="color-scheme" content="dark light">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
      </nav>
    </div>
  </header>

  <main class="container prose">
    <h1>Impressum</h1>

    <!--
      Name, Anschrift und E-Mail stehen nicht im Repo, sondern kommen beim Build aus den
      GitHub-Variablen IMPRESSUM_NAME, IMPRESSUM_ADDRESS und IMPRESSUM_EMAIL (siehe lib/impressum.js).
      Fehlt eine davon, bricht der Produktions-Build ab.
      Dies ist eine Vorlage, keine Rechtsberatung.
    -->

    <h2>Angaben gemäß § 5 DDG</h2>
    <p>
      {{IMPRESSUM_NAME}}<br>
      {{IMPRESSUM_ADDRESS}}
    </p>

    <h2>Kontakt</h2>
    <p>E-Mail: {{IMPRESSUM_EMAIL}}</p>

    <h2>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h2>
    <p>
      {{IMPRESSUM_NAME}}<br>
      Anschrift wie oben
    </p>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/" aria-current="page">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
</body>
</html>
