<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranglisten – Bens Games</title>
  <meta name="description" content="Die besten Spielerinnen und Spieler von Bens Games – diese Woche und insgesamt.">
  <meta name="color-scheme" content="dark light">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
        <a href="/ranglisten/" aria-current="page">Ranglisten</a>
        <!-- ACCOUNT_NAV -->
      </nav>
    </div>
  </header>

  <main class="container ranks" data-ranks>
    <div class="ranks__head">
      <h1>Ranglisten</h1>
      <span class="ranks__links"><a class="ranks__hall" href="/ruhmeshalle/">🏆 Ruhmeshalle</a><span data-rank-share></span></span>
    </div>

    <!-- 1. Spiel wählen -->
    <div class="game-tabs" data-rank-games role="tablist" aria-label="Spiel"></div>

    <!-- Kopf des gewählten Spiels mit Rekord aller Zeiten -->
    <section class="rank-hero" data-rank-hero hidden>
      <img class="rank-hero__icon" data-rank-hero-icon src="/favicon.svg" alt="" width="64" height="64">
      <div class="rank-hero__text">
        <span class="rank-hero__label">Rangliste</span>
        <strong class="rank-hero__title" data-rank-hero-title></strong>
        <span class="rank-hero__record" data-rank-record></span>
      </div>
      <a class="button button--small rank-hero__play" data-rank-play href="/">▶ Spielen</a>
    </section>

    <!-- 2. Modus (Hauptmodus zuerst), Level als Auswahl -->
    <div class="ranks__toolbar">
      <div class="chips" data-rank-boards role="tablist" aria-label="Modus"></div>
      <label class="rank-level" data-rank-level-box hidden>
        <span>Level</span>
        <select data-rank-level></select>
      </label>
    </div>

    <!-- 3. Zeitraum mit Countdown -->
    <div class="rank-period">
      <div class="segmented" role="group" aria-label="Zeitraum">
        <button type="button" data-rank-period="week" aria-pressed="true">Diese Woche</button>
        <button type="button" data-rank-period="all" aria-pressed="false">Allzeit</button>
      </div>
      <span class="rank-period__info" data-rank-countdown></span>
    </div>

    <div class="podium" data-rank-podium hidden></div>

    <ol class="ranks__list" data-rank-list></ol>
    <p class="empty" data-rank-empty hidden></p>

    <!-- Eigene Position: immer sichtbar -->
    <aside class="rank-me" data-rank-me hidden></aside>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="../scripts/ranks.js"></script>
</body>
</html>
