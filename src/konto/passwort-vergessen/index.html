<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort vergessen – Bens Games</title>
  <meta name="color-scheme" content="dark light">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
      </nav>
    </div>
  </header>

  <main class="container auth" data-page="passwortVergessen">
    <h1>Passwort vergessen</h1>
    <p class="auth__lead">Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort festlegen kannst.</p>

    <p data-notice hidden></p>

    <form class="form" novalidate>
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="button" type="submit">Link schicken</button>
    </form>

    <p class="auth__switch"><a href="/konto/anmelden/">Zurück zur Anmeldung</a></p>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="../../scripts/account.js"></script>
</body>
</html>
