<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neues Passwort – Bens Games</title>
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
      </nav>
    </div>
  </header>

  <main class="container auth" data-page="passwortNeu">
    <h1>Neues Passwort</h1>
    <p class="auth__lead">Danach wirst du auf allen Geräten abgemeldet und meldest dich mit dem neuen Passwort an.</p>

    <p data-notice hidden></p>

    <form class="form" novalidate>
      <div class="field">
        <label for="password">Neues Passwort</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        <p class="field__hint">Mindestens 10 Zeichen.</p>
        <p class="field__error" data-error-for="password" hidden></p>
      </div>
      <button class="button" type="submit">Passwort speichern</button>
    </form>

    <a class="button" href="/konto/anmelden/" data-next hidden>Zur Anmeldung</a>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="../../scripts/account.js"></script>
</body>
</html>
