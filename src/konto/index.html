<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Konto – Bens Games</title>
  <meta name="color-scheme" content="dark light">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
      </nav>
    </div>
  </header>

  <main class="container auth" data-page="konto">
    <h1>Mein Konto</h1>

    <div data-details hidden>
      <dl class="details">
        <dt>Name</dt>
        <dd data-name></dd>
        <dt>E-Mail-Adresse</dt>
        <dd data-email></dd>
      </dl>
      <p class="auth__lead">Weitere Einstellungen wie Passwort ändern, Geräte verwalten und Konto löschen folgen bald.</p>
      <button class="button button--secondary" type="button" data-logout>Abmelden</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="../scripts/account.js"></script>
</body>
</html>
