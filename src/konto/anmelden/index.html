<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Bens Games</title>
  <meta name="color-scheme" content="dark light">
  <!-- HEAD -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>
  <!-- ENV_BANNER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
        <span>Bens Games</span>
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Bibliothek</a>
      </nav>
    </div>
  </header>

  <main class="container auth" data-page="anmelden">
    <h1>Anmelden</h1>
    <p class="auth__lead">Mit deinem Konto für alle Spiele und Apps.</p>

    <p data-notice hidden></p>
    <button class="button button--secondary" type="button" data-resend hidden>Bestätigungslink erneut senden</button>

    <form class="form" novalidate>
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field__hint"><a href="/konto/passwort-vergessen/">Passwort vergessen?</a></p>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        <span>Angemeldet bleiben <small>(30 Tage, nur auf eigenen Geräten)</small></span>
      </label>
      <button class="button" type="submit">Anmelden</button>
    </form>

    <p class="auth__switch">Noch kein Konto? <a href="/konto/registrieren/">Konto erstellen</a></p>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <!-- YEAR --> Bens Games</span>
      <nav aria-label="Rechtliches">
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="../../scripts/account.js"></script>
</body>
</html>
