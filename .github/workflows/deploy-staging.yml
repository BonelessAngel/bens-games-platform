name: Staging bereitstellen

# main geht automatisch nach staging.bens-games.de (siehe PLATTFORM-PLAN.md, Abschnitt 8).
# Benötigte GitHub Secrets (nur für den eingeschränkten Staging-FTP-Benutzer):
#   STAGING_FTP_SERVER, STAGING_FTP_USERNAME, STAGING_FTP_PASSWORD
# Fehlen sie, wird gebaut und getestet, aber nichts hochgeladen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      HAS_FTP_SECRETS: ${{ secrets.STAGING_FTP_SERVER != '' && secrets.STAGING_FTP_USERNAME != '' && secrets.STAGING_FTP_PASSWORD != '' }}
      HAS_API_SECRETS: ${{ secrets.STAGING_MIGRATION_TOKEN != '' && secrets.STAGING_HTTP_USER != '' && secrets.STAGING_HTTP_PASSWORD != '' }}
      HAS_ADMIN_SECRETS: ${{ secrets.STAGING_FTP_SERVER != '' && secrets.STAGING_ADMIN_FTP_USERNAME != '' && secrets.STAGING_ADMIN_FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:staging
        env:
          IMPRESSUM_NAME: ${{ vars.IMPRESSUM_NAME }}
          IMPRESSUM_ADDRESS: ${{ vars.IMPRESSUM_ADDRESS }}
          IMPRESSUM_EMAIL: ${{ vars.IMPRESSUM_EMAIL }}

      - name: lftp installieren
        if: env.HAS_FTP_SECRETS == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen per FTPS
        if: env.HAS_FTP_SECRETS == 'true'
        env:
          FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          HTACCESS_BLOCK: deploy/htaccess-site.conf
        run: bash scripts/deploy-ftp.sh

      # Sicherheitsnetz: Staging muss nach jedem Upload weiterhin passwortgeschützt sein.
      - name: Verzeichnisschutz prüfen
        if: env.HAS_FTP_SECRETS == 'true'
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://staging.bens-games.de/)
          if [ "$status" != "401" ]; then
            echo "::error::staging.bens-games.de antwortet mit $status statt 401 – Verzeichnisschutz prüfen!"
            exit 1
          fi
          echo "Verzeichnisschutz aktiv (401)."
          # Sicherheits-Kopfzeilen aus deploy/htaccess-site.conf (gelten auch für die 401-Antwort)
          if curl -sI https://staging.bens-games.de/ | grep -qi '^x-frame-options: *SAMEORIGIN'; then
            echo "Sicherheits-Kopfzeilen aktiv."
          else
            echo "::warning::Sicherheits-Kopfzeilen fehlen auf staging.bens-games.de (mod_headers aktiv?)."
          fi

      # Datenbank-Migrationen über den geschützten API-Endpunkt (ohne SSH).
      # Benötigt: STAGING_MIGRATION_TOKEN (gleich wie migration_token in der Server-config.php) sowie
      # STAGING_HTTP_USER/STAGING_HTTP_PASSWORD (eigener Benutzer im KAS-Verzeichnisschutz nur für GitHub).
      - name: Datenbank-Migrationen und Statusabfrage
        if: env.HAS_FTP_SECRETS == 'true' && env.HAS_API_SECRETS == 'true'
        env:
          MIGRATION_TOKEN: ${{ secrets.STAGING_MIGRATION_TOKEN }}
          HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: |
          curl -fsS --user "$HTTP_USER:$HTTP_PASSWORD" -X POST \
            -H "X-Migration-Token: $MIGRATION_TOKEN" \
            https://staging.bens-games.de/api/admin/migrate
          echo
          curl -fsS --user "$HTTP_USER:$HTTP_PASSWORD" https://staging.bens-games.de/api/health
          echo

      # Test-Zentrale admin-staging.bens-games.de (eigener FTP-Benutzer nur für /bens-games-staging-admin/).
      - name: Test-Zentrale bauen
        if: env.HAS_ADMIN_SECRETS == 'true'
        run: npm run build:admin-staging

      - name: Test-Zentrale hochladen
        if: env.HAS_ADMIN_SECRETS == 'true'
        env:
          FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_ADMIN_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_ADMIN_FTP_PASSWORD }}
          LOCAL_DIR: dist-admin/
          HTACCESS_BLOCK: deploy/htaccess-admin.conf
        run: bash scripts/deploy-ftp.sh

      - name: Test-Zentrale geschützt?
        if: env.HAS_ADMIN_SECRETS == 'true'
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://admin-staging.bens-games.de/)
          if [ "$status" != "401" ]; then
            echo "::error::admin-staging.bens-games.de antwortet mit $status statt 401 – Verzeichnisschutz prüfen!"
            exit 1
          fi

      - name: Hinweis bei fehlenden API-Zugangsdaten
        if: env.HAS_FTP_SECRETS == 'true' && env.HAS_API_SECRETS != 'true'
        run: echo "::notice::STAGING_MIGRATION_TOKEN / STAGING_HTTP_USER / STAGING_HTTP_PASSWORD fehlen – Migrationen übersprungen."

      - name: Hinweis bei fehlenden Zugangsdaten
        if: env.HAS_FTP_SECRETS != 'true'
        run: echo "::notice::Staging-Zugangsdaten fehlen noch in den GitHub Secrets – Build erfolgreich, nichts hochgeladen."
